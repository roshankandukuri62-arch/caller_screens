<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDGMS - Employee Login</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"><style>*{font-family:'Plus Jakarta Sans',sans-serif}body{background:linear-gradient(135deg,#ff9a9e 0,#fecfef 40%,#a1c4fd 80%,#c2e9fb 100%);background-size:400% 400%;animation:gradientBG 15s ease infinite;overflow:hidden}@keyframes gradientBG{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}.glass-card{background:rgba(255,255,255,.45);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.6);box-shadow:0 20px 50px rgba(235,110,165,.2),0 10px 25px rgba(100,150,240,.15)}.glass-input{background:rgba(255,255,255,.6);border:1.5px solid rgba(255,255,255,.8);transition:all .3s cubic-bezier(.4,0,.2,1)}.glass-input:focus{background:rgba(255,255,255,.9);border-color:#f43f5e;box-shadow:0 0 0 4px rgba(244,63,94,.15),0 0 15px rgba(96,165,250,.2);outline:0}.input-group input:focus~label,.input-group input:not(:placeholder-shown)~label{transform:translateY(-24px) scale(.85);color:#be185d;font-weight:600}.input-group label{transition:all .25s ease;pointer-events:none}.gradient-btn{background:linear-gradient(135deg,#ec4899 0,#f43f5e 50%,#3b82f6 100%);background-size:200% auto;transition:all .4s ease}.gradient-btn:hover{background-position:right center;box-shadow:0 10px 25px rgba(236,72,153,.4);transform:translateY(-2px)}.gradient-btn:active{transform:translateY(0)}#bubbleCanvas{position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:1}.login-container{position:relative;z-index:10}</style></head><body class="min-h-screen flex items-center justify-center relative p-4 select-none"><canvas id="bubbleCanvas"></canvas><div class="login-container w-full max-w-md"><div class="glass-card rounded-3xl p-8 sm:p-10 relative overflow-hidden transition-all duration-300"><div class="absolute -top-12 -right-12 w-32 h-32 bg-pink-400 rounded-full blur-2xl opacity-50"></div><div class="absolute -bottom-12 -left-12 w-32 h-32 bg-blue-400 rounded-full blur-2xl opacity-50"></div><div class="text-center mb-8 relative"><div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-white/70 shadow-inner mb-4 text-pink-500 font-bold text-2xl border border-white/80">✨</div><h1 class="text-2xl sm:text-3xl font-extrabold text-gray-800 tracking-tight">PDGMS</h1><p class="text-sm font-medium text-pink-700/80 mt-1">Employee Login</p></div><form id="loginForm" class="space-y-6 relative" autocomplete="off"><div class="input-group relative"><input type="text" id="employeeId" placeholder=" " required class="glass-input w-full px-4 py-3.5 rounded-2xl text-gray-800 text-sm font-medium transition-all"><label for="employeeId" class="absolute left-4 top-3.5 text-gray-500 text-sm">Employee ID</label></div><div class="input-group relative"><input type="password" id="password" placeholder=" " required class="glass-input w-full px-4 py-3.5 rounded-2xl text-gray-800 text-sm font-medium transition-all"><label for="password" class="absolute left-4 top-3.5 text-gray-500 text-sm">Password</label></div><div id="errorDisplay" class="hidden text-xs font-semibold text-rose-600 bg-rose-100/80 border border-rose-300/50 rounded-xl p-3 text-center transition-all animate-bounce"></div><button type="submit" id="submitBtn" class="gradient-btn w-full py-4 text-white font-bold rounded-2xl shadow-lg cursor-pointer flex items-center justify-center gap-2"><span id="btnText">Sign In</span><svg id="btnSpinner" class="hidden animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg></button></form><div class="mt-6 text-center text-xs text-gray-500 font-medium">Click anywhere on the screen for bubble magic ✨</div></div></div><script>
        // 1. BACKEND CONNECTOR API CONFIGURATION
        const RENDER_API_URL = "https://caller-screens-backend.onrender.com/api/login";

        // Form Submit Event Handling
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const employee_id = document.getElementById('employeeId').value.trim();
            const password = document.getElementById('password').value;
            const errorDisplay = document.getElementById('errorDisplay');
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');

            // Reset Error Display State
            errorDisplay.classList.add('hidden');
            errorDisplay.textContent = '';

            // Set Loading UI
            submitBtn.disabled = true;
            btnText.textContent = 'Authenticating...';
            btnSpinner.classList.remove('hidden');

            try {
                const response = await fetch(RENDER_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ employee_id, password })
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    // Redirect on success
                    window.location.href = result.redirectUrl || '/dashboard.html';
                } else {
                    showError(result.message || 'Invalid credentials. Please try again.');
                }
            } catch (error) {
                console.error('Network error:', error);
                showError('Unable to reach auth server. Please check your network.');
            } finally {
                // Restore Button State
                submitBtn.disabled = false;
                btnText.textContent = 'Sign In';
                btnSpinner.classList.add('hidden');
            }
        });

        function showError(message) {
            const errorDisplay = document.getElementById('errorDisplay');
            errorDisplay.textContent = message;
            errorDisplay.classList.remove('hidden');
        }

        // ========================================================
        // 2. INTERACTIVE CANVAS BUBBLE & PARTICLE SYSTEM
        // ========================================================
        const canvas = document.getElementById('bubbleCanvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        const bubbles = [];
        const particles = [];

        // Synthesize soft popping audio feedback on clicks using Web Audio API
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playPopSound() {
            try {
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400 + Math.random() * 300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800 + Math.random() * 200, audioCtx.currentTime + 0.08);
                
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.08);
            } catch (e) {
                // Ignore audio context autoplay restrictions gracefully
            }
        }

        // Floating Bubble Constructor
        class Bubble {
            constructor(x, y, isInteractive = false) {
                this.x = x || Math.random() * width;
                this.y = y || height + (Math.random() * 50 + 20);
                this.radius = isInteractive ? Math.random() * 25 + 15 : Math.random() * 20 + 8;
                this.speedY = isInteractive ? -(Math.random() * 3 + 2) : -(Math.random() * 1.2 + 0.4);
                this.speedX = (Math.random() - 0.5) * 1.5;
                this.alpha = isInteractive ? 0.85 : Math.random() * 0.4 + 0.2;
                this.colorHue = Math.random() > 0.4 ? 330 : 210; // Pinkish (330) or Electric Blue (210)
                this.isInteractive = isInteractive;
            }

            update() {
                this.y += this.speedY;
                this.x += Math.sin(this.y * 0.02) * 0.8 + this.speedX;
                if (this.isInteractive) {
                    this.alpha -= 0.005; // Interactive bubbles fade slowly as they rise
                }
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                
                // Radial Gradient for Glossy Bubble Look
                const grad = ctx.createRadialGradient(
                    this.x - this.radius * 0.3, 
                    this.y - this.radius * 0.3, 
                    this.radius * 0.1, 
                    this.x, 
                    this.y, 
                    this.radius
                );
                grad.addColorStop(0, `hsla(${this.colorHue}, 100%, 95%, 0.9)`);
                grad.addColorStop(0.6, `hsla(${this.colorHue}, 90%, 70%, 0.4)`);
                grad.addColorStop(1, `hsla(${this.colorHue + 20}, 90%, 60%, 0.1)`);

                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = grad;
                ctx.fill();

                // Bubble Reflection Highlight
                ctx.beginPath();
                ctx.arc(this.x - this.radius * 0.35, this.y - this.radius * 0.35, this.radius * 0.25, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.65)';
                ctx.fill();

                ctx.restore();
            }
        }

        // Particle Burst upon Click / Pop
        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = Math.random() * 4 + 2;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 6 + 2;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.alpha = 1;
                this.colorHue = Math.random() > 0.5 ? 330 : 210;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.05; // Light gravity on particles
                this.alpha -= 0.025;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = `hsl(${this.colorHue}, 100%, 75%)`;
                ctx.fill();
                ctx.restore();
            }
        }

        // Generate Ambient Background Floating Bubbles
        for (let i = 0; i < 25; i++) {
            const b = new Bubble();
            b.y = Math.random() * height; // Distribute across full initial height
            bubbles.push(b);
        }

        // Click Event listener to spawn interactive bubbles & explosion burst
        window.addEventListener('click', (e) => {
            playPopSound();

            // Spawn 3-5 ascending bubbles at click location
            const spawnCount = Math.floor(Math.random() * 3) + 3;
            for (let i = 0; i < spawnCount; i++) {
                bubbles.push(new Bubble(
                    e.clientX + (Math.random() - 0.5) * 20, 
                    e.clientY + (Math.random() - 0.5) * 20, 
                    true
                ));
            }

            // Spawn 8 bursting particles
            for (let i = 0; i < 10; i++) {
                particles.push(new Particle(e.clientX, e.clientY));
            }
        });

        // Animation Loop
        function animate() {
            ctx.clearRect(0, 0, width, height);

            // Continuously replenish ambient background bubbles
            if (bubbles.length < 35 && Math.random() < 0.1) {
                bubbles.push(new Bubble());
            }

            // Update & Render Bubbles
            for (let i = bubbles.length - 1; i >= 0; i--) {
                const b = bubbles[i];
                b.update();
                b.draw();

                // Remove out of bounds or faded bubbles
                if (b.y < -50 || b.alpha <= 0) {
                    bubbles.splice(i, 1);
                }
            }

            // Update & Render Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update();
                p.draw();

                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                }
            }

            requestAnimationFrame(animate);
        }

        window.onload = animate;
</script></body></html>
