<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> PDGMS - Live Call Logger </title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Plus Jakarta Sans', sans-serif; }
        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 40%, #a1c4fd 80%, #c2e9fb 100%);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            overflow-x: hidden;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 20px 50px rgba(235, 110, 165, 0.2), 0 10px 25px rgba(100, 150, 240, 0.15);
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.85);
            transition: all 0.3s ease;
        }
        .gradient-btn {
            background: linear-gradient(135deg, #ec4899 0%, #f43f5e 50%, #3b82f6 100%);
            background-size: 200% auto;
            transition: all 0.4s ease;
        }
        .gradient-btn:hover:not(:disabled) {
            background-position: right center;
            box-shadow: 0 10px 25px rgba(236, 72, 153, 0.4);
            transform: translateY(-2px);
        }
        .gradient-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        #bubbleCanvas {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 1;
        }
        .container-relative { position: relative; z-index: 10; }
    </style>
</head>
<body class="min-h-screen p-4 sm:p-8 select-none relative">

    <canvas id="bubbleCanvas"></canvas>

    <div class="container-relative max-w-6xl mx-auto space-y-6">
        <!-- Top Navigation Bar -->
        <div class="glass-card rounded-3xl p-6 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
            <div>
                <h1 class="text-2xl sm:text-3xl font-extrabold text-gray-800 tracking-tight">PDGMS - Live Call Logger</h1>
                <p class="text-xs sm:text-sm font-medium text-pink-900/80 mt-1">Meridian Growth Partners — Interactive Playbook</p>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="window.location.href='/dashboard.html'" class="px-5 py-2.5 rounded-2xl bg-white/70 hover:bg-white text-gray-700 font-bold text-xs border border-white transition-all shadow-sm cursor-pointer flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    Back to Dashboard
                </button>
            </div>
        </div>

        <!-- Dynamic On Call Banner -->
        <div id="onCallBanner" class="hidden glass-card rounded-2xl p-4 border-l-8 border-pink-500 flex items-center justify-between">
            <div>
                <div class="text-[10px] font-extrabold text-pink-700 uppercase tracking-widest flex items-center gap-2">
                    <span>On a call with</span>
                    <span id="bannerProspectTypeBadge" class="px-2 py-0.5 rounded-md bg-purple-100 text-purple-800 text-[9px] font-black uppercase">Existing Contact</span>
                </div>
                <div class="flex items-baseline gap-3 mt-0.5">
                    <span id="bannerCompanyName" class="text-xl font-black text-gray-800">Company Name</span>
                    <span class="text-sm font-bold text-gray-700">| <span id="bannerProspectName">Prospect Name</span></span>
                    <span id="bannerProspectRole" class="text-xs font-semibold text-gray-500 italic">(Role)</span>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <div id="bannerMoodTag" class="px-3 py-1 rounded-full text-xs font-bold text-white bg-orange-500 shadow-sm">
                    Mood: Hesitant
                </div>
                <div class="flex items-center gap-2 bg-emerald-100 text-emerald-800 px-3 py-1 rounded-full text-xs font-bold border border-emerald-300 animate-pulse">
                    <span class="w-2 h-2 rounded-full bg-emerald-600"></span>
                    Call Active
                </div>
            </div>
        </div>

        <!-- 6 Stage Tabs Header (Stage 0: Prospect Details + 5 Active Stages) -->
        <div class="glass-card rounded-2xl p-2 overflow-x-auto">
            <div class="flex space-x-2 min-w-max" id="tabContainer">
                <!-- Tab buttons generated dynamically -->
            </div>
        </div>

        <!-- TAB CONTENT CONTAINERS -->
        <div id="tabContentArea" class="glass-card rounded-3xl p-6 sm:p-8 space-y-6 overflow-visible">

            <!-- TAB 0: PROSPECT DETAILS -->
            <div id="tabContent-0" class="tab-pane space-y-6">
                <div class="border-b border-pink-200/60 pb-4">
                    <h2 class="text-xl font-bold text-gray-800">Prospect Qualification Details</h2>
                    <p class="text-xs text-gray-600 mt-1">Select whether this is a new or existing prospect before launching the call Logger.</p>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- New Prospect Toggle -->
                    <div class="glass-panel p-5 rounded-2xl space-y-3">
                        <label class="text-xs font-bold text-pink-700 uppercase">Is this a new prospect?</label>
                        <div class="flex gap-4">
                            <label class="flex items-center gap-2 cursor-pointer text-xs font-bold text-gray-700">
                                <input type="radio" name="isNewProspect" value="yes" class="accent-pink-600" onchange="toggleProspectMode('yes')"> Yes
                            </label>
                            <label class="flex items-center gap-2 cursor-pointer text-xs font-bold text-gray-700">
                                <input type="radio" name="isNewProspect" value="no" class="accent-pink-600" onchange="toggleProspectMode('no')"> No (Existing Company)
                            </label>
                        </div>
                    </div>

                    <!-- Company Name Box -->
                    <div class="glass-panel p-5 rounded-2xl space-y-2 relative">
                        <label class="text-xs font-bold text-pink-700 uppercase">Company Name</label>
                        <div id="companyInputContainer" class="relative">
                            <input type="text" id="inputCompanyName" placeholder="Select 'Is this a new prospect?' first" disabled class="w-full px-3 py-2 rounded-xl bg-white/80 border border-white text-xs text-gray-800 focus:outline-none" autocomplete="off">
                            <div id="dropdownCompanyList" class="absolute left-0 right-0 top-full mt-1 z-50 max-h-48 overflow-y-auto space-y-1 text-xs hidden bg-white shadow-xl p-2 rounded-xl border border-pink-200"></div>
                        </div>
                    </div>

                    <!-- Prospect Name Box -->
                    <div class="glass-panel p-5 rounded-2xl space-y-2">
                        <label class="text-xs font-bold text-pink-700 uppercase">Prospect Name</label>
                        <input type="text" id="inputProspectName" placeholder="e.g. Rajesh Sharma" oninput="validateProspectTab()" class="w-full px-3 py-2 rounded-xl bg-white/80 border border-white text-xs text-gray-800 focus:outline-none focus:ring-2 focus:ring-pink-400">
                    </div>

                    <!-- Prospect Role Box -->
                    <div class="glass-panel p-5 rounded-2xl space-y-2">
                        <label class="text-xs font-bold text-pink-700 uppercase">Prospect Role</label>
                        <input type="text" id="inputProspectRole" placeholder="e.g. Managing Director / Plant Head" oninput="validateProspectTab()" class="w-full px-3 py-2 rounded-xl bg-white/80 border border-white text-xs text-gray-800 focus:outline-none focus:ring-2 focus:ring-pink-400">
                    </div>
                </div>

                <!-- Footer Actions -->
                <div class="flex justify-end pt-4 border-t border-pink-200/50">
                    <button id="btnProceedTab0" disabled onclick="nextTab()" class="gradient-btn px-8 py-3 text-white font-bold text-xs rounded-xl shadow-md cursor-pointer flex items-center gap-2">
                        <span>Proceed to Stage 1: The Start</span>
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                    </button>
                </div>
            </div>

            <!-- DYNAMIC ACTIVE STAGES 1 TO 5 CONTAINER -->
            <div id="activeStagesContainer"></div>

        </div>
    </div>

    <!-- Script Execution -->
    <script>
        const BACKEND_URL = 'https://caller-screens.onrender.com';

        const stagesConfig = [
            { id: 0, title: "Prospect Details" },
            { id: 1, title: "1) The Start" },
            { id: 2, title: "2) Reason for Calling & Time Permission" },
            { id: 3, title: "3) Current Needs & Future Plans" },
            { id: 4, title: "4) Consent for the Next Step" },
            { id: 5, title: "5) Call Closure" }
        ];

        let currentTab = 0;
        let prospectData = { 
            isNew: '', 
            company: '', 
            name: '', 
            role: '', 
            moodIndex: 1, 
            isExistingCompanySelected: false,
            selectedResponses: {} // Internal storage for clicked responses per stage
        };
        let cachedCompanies = [];

        const moodMap = {
            0: { name: "Disinterested", fillClass: "bg-red-500", handleColor: "#ef4444", percent: 0 },
            1: { name: "Hesitant", fillClass: "bg-orange-500", handleColor: "#f97316", percent: 33.3 },
            2: { name: "Neutral", fillClass: "bg-yellow-500", handleColor: "#eab308", percent: 66.6 },
            3: { name: "Receptive", fillClass: "bg-emerald-500", handleColor: "#22c55e", percent: 100 }
        };

        // Render Tabs Header
        function renderTabs() {
            const container = document.getElementById('tabContainer');
            container.innerHTML = stagesConfig.map((stage, idx) => `
                <button onclick="switchTab(${idx})" id="tabBtn-${idx}" class="px-4 py-2 rounded-xl text-xs font-bold transition-all whitespace-nowrap ${idx === 0 ? 'bg-pink-600 text-white shadow-md' : 'bg-white/50 text-gray-600 hover:bg-white/80'}">
                    ${stage.title}
                </button>
            `).join('');

            renderActiveStagesHTML();
        }

        function renderActiveStagesHTML() {
            const container = document.getElementById('activeStagesContainer');
            container.innerHTML = [1, 2, 3, 4, 5].map(stageId => `
                <div id="tabContent-${stageId}" class="tab-pane hidden space-y-6">
                    <!-- Guidance Banner -->
                    <div id="stageGuidance-${stageId}" class="p-4 rounded-2xl bg-gradient-to-r from-pink-100/80 to-blue-100/80 border border-white text-xs text-pink-900 font-semibold leading-relaxed"></div>

                    <!-- Main Interactive Playbook Grid -->
                    <div class="grid grid-cols-1 md:grid-cols-12 gap-6 items-start">
                        <!-- Mood Slider Panel (Carried Forward) -->
                        <div class="md:col-span-4 glass-panel p-5 rounded-2xl flex flex-col items-center space-y-3 text-center">
                            <label class="text-[11px] font-extrabold text-pink-800 uppercase tracking-wider">PROSPECT MOOD</label>
                            <div class="flex items-center justify-center gap-6 my-2 w-full px-2">
                                <div id="spectrumTrack-${stageId}" class="spectrum-track-el relative w-3 h-[220px] bg-gray-200 rounded-full cursor-pointer flex flex-col justify-end" data-stage="${stageId}">
                                    <div id="spectrumFill-${stageId}" class="w-full bg-orange-500 rounded-full transition-all duration-200" style="height: 33.3%;"></div>
                                    <div id="spectrumThumb-${stageId}" class="absolute left-1/2 -translate-x-1/2 w-6 h-6 rounded-full bg-pink-500 border-4 border-white shadow-md cursor-grab transition-all" style="bottom: calc(33.3% - 12px);"></div>
                                </div>
                                <div class="flex flex-col justify-between h-[220px] text-xs font-bold text-left py-1">
                                    <span class="text-emerald-600 hover:opacity-80 cursor-pointer" onclick="setMood(3)">Receptive</span>
                                    <span class="text-yellow-600 hover:opacity-80 cursor-pointer" onclick="setMood(2)">Neutral</span>
                                    <span class="text-orange-600 hover:opacity-80 cursor-pointer" onclick="setMood(1)">Hesitant</span>
                                    <span class="text-red-600 hover:opacity-80 cursor-pointer" onclick="setMood(0)">Disinterested</span>
                                </div>
                            </div>
                            <div id="sentimentBadge-${stageId}" class="w-full py-2 px-3 rounded-2xl text-xs font-bold text-white bg-orange-500 shadow-sm transition-all text-center">
                                Hesitant
                            </div>
                        </div>

                        <!-- Expected Responses Grid -->
                        <div class="md:col-span-8 space-y-4">
                            <div class="text-xs font-bold text-gray-700 flex justify-between items-center">
                                <span>Expected Prospect Response:</span>
                                <span class="text-[10px] text-pink-600 font-normal">*Click a response to record selection</span>
                            </div>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3" id="prospectResponsesGrid-${stageId}"></div>

                            <!-- Acknowledgment Box -->
                            <div id="callerReplyBox-${stageId}" class="hidden p-5 rounded-2xl bg-white/90 border-2 border-pink-400 space-y-3 shadow-md">
                                <div class="text-[10px] font-black text-pink-700 uppercase tracking-widest flex items-center gap-1">
                                    <span id="replyBoxTitle-${stageId}">🎯 Stage Guidance</span>
                                </div>
                                <div id="callerNoteBox-${stageId}" class="hidden p-3 rounded-xl bg-amber-50 border border-amber-200 text-amber-900 text-xs font-semibold">
                                    📌 <strong class="text-amber-800">Note:</strong> <span id="callerNoteText-${stageId}"></span>
                                </div>
                                <p id="callerReplyText-${stageId}" class="text-xs text-gray-800 font-medium leading-relaxed"></p>
                            </div>
                        </div>
                    </div>

                    <!-- Caller Notes Box (Purely manual user inputs) -->
                    <div class="glass-panel p-4 rounded-2xl space-y-2">
                        <label class="text-xs font-bold text-pink-700 uppercase">Stage ${stageId} Manual Caller Notes</label>
                        <textarea id="notesStage${stageId}" rows="3" placeholder="Write down key takeaways, customer inputs, or strategic notes..." class="w-full p-3 rounded-xl bg-white/80 border border-white text-xs text-gray-800 focus:outline-none focus:ring-2 focus:ring-pink-400"></textarea>
                    </div>

                    <!-- Stage Navigation Controls -->
                    <div class="flex items-center justify-between pt-4 border-t border-pink-200/50">
                        <button onclick="endCall()" class="px-5 py-2.5 rounded-xl bg-red-100 hover:bg-red-200 text-red-700 font-bold text-xs border border-red-300 transition-all cursor-pointer">
                            End Call
                        </button>
                        ${stageId < 5 ? `
                            <button onclick="nextTab()" class="gradient-btn px-8 py-3 text-white font-bold text-xs rounded-xl shadow-md cursor-pointer flex items-center gap-2">
                                <span>Proceed to Stage ${stageId + 1}</span>
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                            </button>
                        ` : ''}
                    </div>
                </div>
            `).join('');

            bindDragEvents();
        }

        function switchTab(tabIdx) {
            if (tabIdx > 0 && !isProspectValid()) {
                alert('Please complete all Prospect Details first!');
                return;
            }

            document.querySelectorAll('.tab-pane').forEach(el => el.classList.add('hidden'));
            document.getElementById(`tabContent-${tabIdx}`).classList.remove('hidden');

            stagesConfig.forEach((_, idx) => {
                const btn = document.getElementById(`tabBtn-${idx}`);
                if (idx === tabIdx) {
                    btn.className = 'px-4 py-2 rounded-xl text-xs font-bold transition-all whitespace-nowrap bg-pink-600 text-white shadow-md';
                } else {
                    btn.className = 'px-4 py-2 rounded-xl text-xs font-bold transition-all whitespace-nowrap bg-white/50 text-gray-600 hover:bg-white/80';
                }
            });

            currentTab = tabIdx;

            const banner = document.getElementById('onCallBanner');
            if (tabIdx > 0) {
                banner.classList.remove('hidden');
                document.getElementById('bannerCompanyName').innerText = prospectData.company;
                document.getElementById('bannerProspectName').innerText = prospectData.name;
                document.getElementById('bannerProspectRole').innerText = `(${prospectData.role})`;

                const typeBadge = document.getElementById('bannerProspectTypeBadge');
                if (typeBadge) {
                    typeBadge.innerText = prospectData.isNew === 'no' ? 'Existing Contact' : 'New Prospect';
                    typeBadge.className = prospectData.isNew === 'no' 
                        ? 'px-2 py-0.5 rounded-md bg-purple-100 text-purple-800 text-[9px] font-black uppercase' 
                        : 'px-2 py-0.5 rounded-md bg-blue-100 text-blue-800 text-[9px] font-black uppercase';
                }

                updateStageGuidance(tabIdx);
                setMood(prospectData.moodIndex);
            } else {
                banner.classList.add('hidden');
            }
        }

        function updateStageGuidance(stageId) {
            const el = document.getElementById(`stageGuidance-${stageId}`);
            if (!el) return;

            const isExisting = prospectData.isNew === 'no';

            const guidanceMap = {
                1: isExisting 
                    ? `💡 <strong>Stage Focus (Existing Contact):</strong> Remind them subtly of who you are and previous conversations. Do not re-explain basic services.`
                    : `💡 <strong>Stage Focus (New Prospect):</strong> State who you are and introduce Meridian Growth Partners clearly. Offer a tailored sample growth report to help them realize their full potential.`,
                2: isExisting 
                    ? `💡 <strong>Stage Focus (Existing Contact):</strong> State your exact reason for calling and request brief permission for their time. Touch upon past context smoothly without re-explaining company identity.`
                    : `💡 <strong>Stage Focus (New Prospect):</strong> Clearly state the exact reason for calling, explaining specifically how Meridian Growth Partners assists manufacturing operations, and ask for permission to discuss their growth needs.`,
                3: `💡 <strong>Stage Focus:</strong> Ask discovery questions regarding their current operations, capacity, and future expansion plans. Listen closely and log key details.`,
                4: `💡 <strong>Stage Focus:</strong> Introduce the next step: a strategic session with the Founder of Meridian Growth Partners for a detailed sectoral analysis & roadmap. Seek their consent.`,
                5: `💡 <strong>Stage Focus:</strong> Finalize logistical details for the next step (meeting dates or report dispatch via WhatsApp/email) and close the call with a firm thank you.`
            };

            el.innerHTML = guidanceMap[stageId] || '';
        }

        function nextTab() {
            if (currentTab < stagesConfig.length - 1) {
                switchTab(currentTab + 1);
            }
        }

        // Prospect Qualification Validation
        async function toggleProspectMode(mode) {
            prospectData.isNew = mode;
            prospectData.isExistingCompanySelected = false;
            const input = document.getElementById('inputCompanyName');
            const dropdown = document.getElementById('dropdownCompanyList');

            if (mode === 'yes') {
                input.value = '';
                input.disabled = false;
                input.placeholder = "Type new company name...";
                dropdown.classList.add('hidden');
            } else {
                input.value = '';
                input.disabled = false;
                input.placeholder = "Click or type to search existing companies...";
                if (cachedCompanies.length === 0) {
                    try {
                        const res = await fetch(`${BACKEND_URL}/api/calls/filter-options/company_name`);
                        const data = await res.json();
                        cachedCompanies = data.options || [];
                    } catch (e) {
                        console.error('Failed to load companies:', e);
                    }
                }
            }
            validateProspectTab();
        }

        const companyInput = document.getElementById('inputCompanyName');
        const companyDropdown = document.getElementById('dropdownCompanyList');

        companyInput.addEventListener('focus', () => {
            if (prospectData.isNew === 'no') showCompanyDropdown(cachedCompanies);
        });

        companyInput.addEventListener('input', () => {
            if (prospectData.isNew === 'no') {
                const currentVal = companyInput.value.trim();
                const exactMatch = cachedCompanies.find(c => String(c).toLowerCase() === currentVal.toLowerCase());
                prospectData.isExistingCompanySelected = !!exactMatch;

                const filtered = cachedCompanies.filter(c => String(c).toLowerCase().includes(currentVal.toLowerCase()));
                showCompanyDropdown(filtered);
            } else {
                prospectData.isExistingCompanySelected = false;
            }
            validateProspectTab();
        });

        function showCompanyDropdown(list) {
            companyDropdown.innerHTML = '';
            if (list.length === 0) {
                companyDropdown.classList.add('hidden');
                return;
            }
            companyDropdown.classList.remove('hidden');
            list.slice(0, 20).forEach(comp => {
                const div = document.createElement('div');
                div.className = 'px-3 py-1.5 hover:bg-pink-100 rounded-lg cursor-pointer text-gray-800 font-medium text-xs';
                div.innerText = comp;
                div.addEventListener('click', () => {
                    companyInput.value = comp;
                    prospectData.isExistingCompanySelected = true;
                    companyDropdown.classList.add('hidden');
                    validateProspectTab();
                });
                companyDropdown.appendChild(div);
            });
        }

        document.addEventListener('click', (e) => {
            if (!companyInput.contains(e.target) && !companyDropdown.contains(e.target)) {
                companyDropdown.classList.add('hidden');
            }
        });

        function validateProspectTab() {
            const nameInput = document.getElementById('inputProspectName');
            const roleInput = document.getElementById('inputProspectRole');

            prospectData.company = companyInput ? companyInput.value.trim() : '';
            prospectData.name = nameInput ? nameInput.value.trim() : '';
            prospectData.role = roleInput ? roleInput.value.trim() : '';

            const isValid = isProspectValid();
            document.getElementById('btnProceedTab0').disabled = !isValid;
        }

        function isProspectValid() {
            if (prospectData.isNew === '' || prospectData.name === '' || prospectData.role === '' || prospectData.company === '') {
                return false;
            }
            if (prospectData.isNew === 'no') {
                return prospectData.isExistingCompanySelected || cachedCompanies.some(c => String(c).toLowerCase() === prospectData.company.toLowerCase());
            }
            return true;
        }

        // Global Mood Memory Function
        function setMood(index) {
            index = Math.max(0, Math.min(3, index));
            prospectData.moodIndex = index;
            const mood = moodMap[index];

            [1, 2, 3, 4, 5].forEach(stageId => {
                const fill = document.getElementById(`spectrumFill-${stageId}`);
                const thumb = document.getElementById(`spectrumThumb-${stageId}`);
                const badge = document.getElementById(`sentimentBadge-${stageId}`);

                if (fill && thumb && badge) {
                    fill.style.height = `${mood.percent}%`;
                    fill.className = `w-full rounded-full transition-all duration-200 ${mood.fillClass}`;
                    thumb.style.bottom = `calc(${mood.percent}% - 12px)`;
                    thumb.style.borderColor = mood.handleColor;

                    badge.innerText = mood.name;
                    badge.className = `w-full py-2 px-3 rounded-2xl text-xs font-bold text-white shadow-sm transition-all text-center ${mood.fillClass}`;
                }
            });

            const bannerMoodTag = document.getElementById('bannerMoodTag');
            if (bannerMoodTag) {
                bannerMoodTag.innerText = `Mood: ${mood.name}`;
                bannerMoodTag.className = `px-3 py-1 rounded-full text-xs font-bold text-white shadow-sm ${mood.fillClass}`;
            }

            if (currentTab > 0) {
                renderStageExpectedResponses(currentTab, index);
            }
        }

        let isDragging = false;
        function bindDragEvents() {
            document.querySelectorAll('.spectrum-track-el').forEach(track => {
                const handleMove = (e) => {
                    const rect = track.getBoundingClientRect();
                    const clientY = e.clientY || (e.touches && e.touches[0].clientY);
                    if (!clientY) return;
                    let ratio = Math.max(0, Math.min(1, (rect.bottom - clientY) / rect.height));
                    setMood(Math.round(ratio * 3));
                };

                track.addEventListener('mousedown', (e) => { isDragging = true; handleMove(e); });
                track.addEventListener('touchstart', (e) => { isDragging = true; handleMove(e); });
            });

            window.addEventListener('mousemove', (e) => { if (isDragging) { handlePointerMoveGlobal(e); } });
            window.addEventListener('touchmove', (e) => { if (isDragging) { handlePointerMoveGlobal(e); } });
            window.addEventListener('mouseup', () => { isDragging = false; });
            window.addEventListener('touchend', () => { isDragging = false; });
        }

        function handlePointerMoveGlobal(e) {
            const activeTrack = document.getElementById(`spectrumTrack-${currentTab}`);
            if (!activeTrack) return;
            const rect = activeTrack.getBoundingClientRect();

    <!-- Canvas Bubble Background Script -->
    <script>
        const canvas = document.getElementById('bubbleCanvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        const bubbles = [];
        class Bubble {
            constructor(x, y) {
                this.x = x || Math.random() * width;
                this.y = y || height + 50;
                this.radius = Math.random() * 20 + 8;
                this.speedY = -(Math.random() * 1.2 + 0.4);
                this.speedX = (Math.random() - 0.5) * 1.5;
                this.alpha = Math.random() * 0.4 + 0.2;
                this.colorHue = Math.random() > 0.4 ? 330 : 210;
            }
            update() {
                this.y += this.speedY;
                this.x += Math.sin(this.y * 0.02) * 0.8 + this.speedX;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                const grad = ctx.createRadialGradient(this.x - this.radius * 0.3, this.y - this.radius * 0.3, this.radius * 0.1, this.x, this.y, this.radius);
                grad.addColorStop(0, `hsla(${this.colorHue}, 100%, 95%, 0.9)`);
                grad.addColorStop(0.6, `hsla(${this.colorHue}, 90%, 70%, 0.4)`);
                grad.addColorStop(1, `hsla(${this.colorHue + 20}, 90%, 60%, 0.1)`);
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = grad;
                ctx.fill();
                ctx.restore();
            }
        }

        for (let i = 0; i < 20; i++) {
            const b = new Bubble();
            b.y = Math.random() * height;
            bubbles.push(b);
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            if (bubbles.length < 30 && Math.random() < 0.1) bubbles.push(new Bubble());
            for (let i = bubbles.length - 1; i >= 0; i--) {
                bubbles[i].update();
                bubbles[i].draw();
                if (bubbles[i].y < -50) bubbles.splice(i, 1);
            }
            requestAnimationFrame(animate);
        }
        window.onload = animate;
    </script>
