<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDGMS - Call Logger</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 40%, #a1c4fd 80%, #c2e9fb 100%);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 20px 50px rgba(235, 110, 165, 0.2),
                        0 10px 25px rgba(100, 150, 240, 0.15);
        }

        .glass-input {
            background: rgba(255, 255, 255, 0.6);
            border: 1.5px solid rgba(255, 255, 255, 0.8);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-input:focus {
            background: rgba(255, 255, 255, 0.9);
            border-color: #f43f5e;
            box-shadow: 0 0 0 4px rgba(244, 63, 94, 0.15),
                        0 0 15px rgba(96, 165, 250, 0.2);
            outline: none;
        }

        .gradient-btn {
            background: linear-gradient(135deg, #ec4899 0%, #f43f5e 50%, #3b82f6 100%);
            background-size: 200% auto;
            transition: all 0.4s ease;
        }

        .gradient-btn:hover {
            background-position: right center;
            box-shadow: 0 10px 25px rgba(236, 72, 153, 0.4);
            transform: translateY(-2px);
        }

        .gradient-btn:active {
            transform: translateY(0);
        }

        #bubbleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 1;
        }

        .logger-container {
            position: relative;
            z-index: 10;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-6 select-none relative">

    <!-- Interactive Bubble Canvas -->
    <canvas id="bubbleCanvas"></canvas>

    <!-- Call Logger Container -->
    <div class="logger-container w-full max-w-2xl my-8">
        <div class="glass-card rounded-3xl p-6 sm:p-10 relative overflow-hidden">
            
            <!-- Background Glow Accents -->
            <div class="absolute -top-16 -right-16 w-40 h-40 bg-pink-400 rounded-full blur-3xl opacity-50"></div>
            <div class="absolute -bottom-16 -left-16 w-40 h-40 bg-blue-400 rounded-full blur-3xl opacity-50"></div>

            <!-- Top Header & Navigation -->
            <div class="flex items-center justify-between pb-6 mb-6 border-b border-pink-200/50">
                <div>
                    <h1 class="text-2xl sm:text-3xl font-extrabold text-gray-800 tracking-tight">
                        PDGMS - Call Logger
                    </h1>
                    <p class="text-sm font-medium text-pink-700/80 mt-1">
                        Record and manage employee call transcripts
                    </p>
                </div>

                <button 
                    onclick="window.location.href='/dashboard.html'" 
                    class="px-4 py-2 rounded-2xl bg-white/60 hover:bg-white/90 text-gray-700 font-bold text-xs sm:text-sm border border-white/80 transition-all shadow-sm hover:shadow-md cursor-pointer flex items-center gap-1.5"
                >
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    Back
                </button>
            </div>

            <!-- Call Logger Form -->
            <form id="callLogForm" onsubmit="event.preventDefault(); alert('Call logged successfully!');" class="space-y-5">
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <!-- Caller ID / Phone -->
                    <div>
                        <label class="block text-xs font-bold text-pink-900 mb-1.5 uppercase tracking-wide">
                            Caller ID / Account #
                        </label>
                        <input 
                            type="text" 
                            placeholder="e.g. C-10294" 
                            required
                            class="glass-input w-full px-4 py-3 rounded-2xl text-gray-800 text-sm font-medium"
                        >
                    </div>

                    <!-- Call Duration -->
                    <div>
                        <label class="block text-xs font-bold text-pink-900 mb-1.5 uppercase tracking-wide">
                            Call Duration (mm:ss)
                        </label>
                        <input 
                            type="text" 
                            placeholder="e.g. 04:35" 
                            required
                            class="glass-input w-full px-4 py-3 rounded-2xl text-gray-800 text-sm font-medium"
                        >
                    </div>
                </div>

                <!-- Call Category -->
                <div>
                    <label class="block text-xs font-bold text-pink-900 mb-1.5 uppercase tracking-wide">
                        Inquiry Category
                    </label>
                    <select class="glass-input w-full px-4 py-3 rounded-2xl text-gray-800 text-sm font-medium cursor-pointer">
                        <option value="general">General Support</option>
                        <option value="billing">Billing & Account</option>
                        <option value="technical">Technical Issue</option>
                        <option value="escalation">Escalated Caller</option>
                    </select>
                </div>

                <!-- Transcript / Summary Notes -->
                <div>
                    <label class="block text-xs font-bold text-pink-900 mb-1.5 uppercase tracking-wide">
                        Transcript / Turn Summary
                    </label>
                    <textarea 
                        rows="4" 
                        placeholder="Enter caller turn details or notes here..." 
                        required
                        class="glass-input w-full p-4 rounded-2xl text-gray-800 text-sm font-medium resize-none"
                    ></textarea>
                </div>

                <!-- Submit Button -->
                <button 
                    type="submit" 
                    class="gradient-btn w-full py-4 text-white font-bold rounded-2xl shadow-lg cursor-pointer flex items-center justify-center gap-2 mt-2"
                >
                    <span>Log Call Record</span>
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                </button>
            </form>

            <div class="mt-6 text-center text-xs text-gray-500 font-medium">
                Click anywhere on the screen for bubble magic ✨
            </div>
        </div>
    </div>

    <!-- Interactive Canvas Logic -->
    <script>
        const canvas = document.getElementById('bubbleCanvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        const bubbles = [];
        const particles = [];

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playPopSound() {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400 + Math.random() * 300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800 + Math.random() * 200, audioCtx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.08);
            } catch (e) {}
        }

        class Bubble {
            constructor(x, y, isInteractive = false) {
                this.x = x || Math.random() * width;
                this.y = y || height + (Math.random() * 50 + 20);
                this.radius = isInteractive ? Math.random() * 25 + 15 : Math.random() * 20 + 8;
                this.speedY = isInteractive ? -(Math.random() * 3 + 2) : -(Math.random() * 1.2 + 0.4);
                this.speedX = (Math.random() - 0.5) * 1.5;
                this.alpha = isInteractive ? 0.85 : Math.random() * 0.4 + 0.2;
                this.colorHue = Math.random() > 0.4 ? 330 : 210;
                this.isInteractive = isInteractive;
            }

            update() {
                this.y += this.speedY;
                this.x += Math.sin(this.y * 0.02) * 0.8 + this.speedX;
                if (this.isInteractive) this.alpha -= 0.005;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                const grad = ctx.createRadialGradient(
                    this.x - this.radius * 0.3, this.y - this.radius * 0.3, this.radius * 0.1, 
                    this.x, this.y, this.radius
                );
                grad.addColorStop(0, `hsla(${this.colorHue}, 100%, 95%, 0.9)`);
                grad.addColorStop(0.6, `hsla(${this.colorHue}, 90%, 70%, 0.4)`);
                grad.addColorStop(1, `hsla(${this.colorHue + 20}, 90%, 60%, 0.1)`);

                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = grad;
                ctx.fill();

                ctx.beginPath();
                ctx.arc(this.x - this.radius * 0.35, this.y - this.radius * 0.35, this.radius * 0.25, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.65)';
                ctx.fill();
                ctx.restore();
            }
        }

        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = Math.random() * 4 + 2;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 6 + 2;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.alpha = 1;
                this.colorHue = Math.random() > 0.5 ? 330 : 210;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.05;
                this.alpha -= 0.025;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = `hsl(${this.colorHue}, 100%, 75%)`;
                ctx.fill();
                ctx.restore();
            }
        }

        for (let i = 0; i < 25; i++) {
            const b = new Bubble();
            b.y = Math.random() * height;
            bubbles.push(b);
        }

        window.addEventListener('click', (e) => {
            playPopSound();
            const spawnCount = Math.floor(Math.random() * 3) + 3;
            for (let i = 0; i < spawnCount; i++) {
                bubbles.push(new Bubble(
                    e.clientX + (Math.random() - 0.5) * 20, 
                    e.clientY + (Math.random() - 0.5) * 20, 
                    true
                ));
            }
            for (let i = 0; i < 10; i++) {
                particles.push(new Particle(e.clientX, e.clientY));
            }
        });

        function animate() {
            ctx.clearRect(0, 0, width, height);

            if (bubbles.length < 35 && Math.random() < 0.1) {
                bubbles.push(new Bubble());
            }

            for (let i = bubbles.length - 1; i >= 0; i--) {
                const b = bubbles[i];
                b.update();
                b.draw();
                if (b.y < -50 || b.alpha <= 0) bubbles.splice(i, 1);
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update();
                p.draw();
                if (p.alpha <= 0) particles.splice(i, 1);
            }

            requestAnimationFrame(animate);
        }

        window.onload = animate;
    </script>
</body>
</html>
